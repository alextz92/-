<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>מעקב ייצור מתקן חצץ אספלט</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --asphalt-900:#0070B5;
    --asphalt-800:#1C86C7;
    --asphalt-700:#3D9BD4;
    --stone-100:#EFF8FC;
    --stone-200:#DCEEF7;
    --stone-300:#C3E0EF;
    --stone-500:#5B7D8A;
    --safety-orange:#D5E24C;
    --safety-orange-dark:#A9B93A;
    --safety-yellow:#16C2F3;
    --text-dark:#10222B;
    --text-light:#F2FBFD;
    --success:#2E8142;
    --success-bg:#E8F5EA;
    --danger:#C0392B;
    --danger-bg:#FAE6E4;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  button{-webkit-appearance:none;appearance:none;font:inherit;-webkit-user-select:none;user-select:none;}
  input,select,textarea{-webkit-user-select:text;user-select:text;}
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
  html,body{margin:0;padding:0;overscroll-behavior:none;height:100%;}
  body{
    background:var(--asphalt-900);
    color:var(--text-dark);
    font-family:'Rubik',sans-serif;
    min-height:100vh;
    min-height:100dvh;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    overscroll-behavior-y:contain;
  }
  body.lang-ar{font-family:'Tajawal',sans-serif;}
  #root{
    max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--stone-100);
    display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.4);
    padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
    overflow-x:hidden;
  }

  header.topbar{
    background:var(--asphalt-900);
    color:var(--text-light);
    padding:calc(16px + env(safe-area-inset-top)) 18px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    position:relative;
    background-image:repeating-linear-gradient(135deg, rgba(255,255,255,0.02) 0 8px, transparent 8px 16px);
    border-bottom:4px solid var(--safety-orange);
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand-logo-img{
    height:44px;width:auto;flex:none;object-fit:contain;
    background:#fff;border-radius:6px;padding:2px;box-sizing:content-box;
  }
  .brand-title{font-size:14px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .brand-sub{font-size:11px;color:var(--stone-300);opacity:.8;}
  .lang-switch{
    display:flex;background:rgba(255,255,255,.08);border-radius:999px;padding:3px;flex:none;
  }
  .lang-switch button{
    border:none;background:transparent;color:var(--stone-300);
    font-family:inherit;font-size:13px;font-weight:700;padding:9px 15px;border-radius:999px;cursor:pointer;
    min-height:38px;
  }
  .lang-switch button.active{background:var(--safety-orange);color:#10222B;}

  .stepper{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 22px 6px;
    background:var(--stone-100);
  }
  .step-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;position:relative;}
  .step-line{
    position:absolute;top:15px;height:0;left:0;right:0;
    border-top:3px dashed var(--stone-300);
    z-index:0;
  }
  .step-wrap:first-child .step-line{right:50%;}
  .step-wrap:last-child .step-line{left:50%;}
  .step-dot{
    width:32px;height:32px;border-radius:50%;background:var(--stone-200);border:2px solid var(--stone-300);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--stone-500);
    z-index:1;transition:.15s;
  }
  .step-wrap.done .step-dot{background:var(--success);border-color:var(--success);color:#fff;}
  .step-wrap.active .step-dot{background:var(--safety-orange);border-color:var(--safety-orange-dark);color:#10222B;}
  .step-wrap.done .step-line, .step-wrap.active .step-line{border-top-color:var(--safety-orange);}
  .step-label{font-size:10.5px;color:var(--stone-500);font-weight:600;text-align:center;}
  .step-wrap.active .step-label{color:var(--text-dark);}

  main{flex:1;padding:18px 18px calc(100px + env(safe-area-inset-bottom));position:relative;}
  main.truck-page-bg{
    background-repeat:no-repeat;
    background-position:center top;
    background-size:cover;
    background-attachment:local;
  }
  .page-title{
    font-size:17px;font-weight:700;margin:2px 0 16px;
    display:flex;align-items:center;gap:8px;color:var(--asphalt-900);
    padding-bottom:10px;border-bottom:2px solid var(--stone-300);
  }
  .page-title .dash{width:6px;height:22px;border-radius:3px;background:var(--safety-orange);flex:none;}

  .field{margin-bottom:16px;}
  .field label{
    display:flex;align-items:center;gap:6px;
    font-size:13px;font-weight:600;color:var(--asphalt-700);margin-bottom:6px;
  }
  .field label .ic{flex:none;opacity:.65;}
  .field input, .field select{
    width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--stone-300);
    background:#fff;font-family:inherit;font-size:16px;color:var(--text-dark);
    -webkit-appearance:none;appearance:none;
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--safety-orange);}
  .field select, .entry-row .mini-field select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235E8C81' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;background-position:left 10px center;background-size:16px;padding-left:34px;
  }
  .field.error input, .field.error select{border-color:var(--danger);}
  .field-err{font-size:11.5px;color:var(--danger);margin-top:4px;display:none;}
  .field.error .field-err{display:block;}

  .card{
    background:#fff;border:1px solid var(--stone-300);border-radius:var(--radius);
    padding:14px;margin-bottom:14px;
  }

  .row-table{display:flex;flex-direction:column;gap:10px;}
  .table-head-hint{font-size:11.5px;color:var(--stone-500);margin-bottom:8px;}
  .entry-row{
    background:#fff;border:1px solid var(--stone-300);border-radius:12px;padding:12px;position:relative;
  }
  .entry-row .row-num{
    position:absolute;top:-9px;inset-inline-start:10px;background:var(--asphalt-900);color:var(--safety-yellow);
    font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;
  }
  .entry-row .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;}
  .entry-row .mini-field label{font-size:11px;color:var(--stone-500);font-weight:600;margin-bottom:3px;display:block;}
  .entry-row .mini-field input, .entry-row .mini-field select{
    width:100%;padding:8px 9px;border-radius:8px;border:1.5px solid var(--stone-300);font-family:inherit;font-size:16px;
    -webkit-appearance:none;appearance:none;
  }
  .row-actions{display:flex;justify-content:flex-end;margin-top:8px;}
  .del-btn{
    border:none;background:var(--danger-bg);color:var(--danger);font-family:inherit;font-weight:700;
    font-size:12.5px;padding:9px 13px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:4px;
    min-height:38px;
  }
  .add-btn{
    width:100%;border:2px dashed var(--stone-300);background:transparent;color:var(--asphalt-700);
    font-family:inherit;font-weight:700;font-size:14px;padding:12px;border-radius:12px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px;
  }
  .add-btn:active{background:var(--stone-200);}
  .empty-hint{
    text-align:center;color:var(--stone-500);font-size:13px;padding:18px 10px;border:1.5px dashed var(--stone-300);border-radius:12px;
  }

  nav.bottombar{
    position:sticky;bottom:0;background:var(--stone-100);border-top:1.5px solid var(--stone-300);
    padding:12px 18px calc(12px + env(safe-area-inset-bottom));
    display:flex;gap:10px;
  }
  .btn{
    flex:1;padding:14px;border-radius:12px;border:none;font-family:inherit;font-weight:700;font-size:15px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn-primary{background:var(--safety-orange);color:#10222B;}
  .btn-primary:active{background:var(--safety-orange-dark);}
  .btn-ghost{background:var(--stone-200);color:var(--asphalt-900);flex:0 0 34%;}
  .btn-ghost:active{background:var(--stone-300);}
  .btn-success{background:var(--success);color:#fff;}

  .home-header{padding:20px 18px 6px;}
  .home-title{font-size:20px;font-weight:800;color:var(--asphalt-900);}
  .home-sub{font-size:13px;color:var(--stone-500);margin-top:4px;}
  .shared-badge{
    margin-top:10px;display:flex;align-items:center;gap:7px;
    background:var(--stone-200);border:1px solid var(--stone-300);border-radius:10px;
    padding:8px 11px;font-size:11.5px;color:var(--asphalt-700);font-weight:600;line-height:1.4;
  }
  .shared-badge svg{flex:none;opacity:.7;}
  .list-title-row{
    display:flex;align-items:center;justify-content:space-between;padding:6px 18px;
  }
  .refresh-btn{
    border:none;background:var(--stone-200);color:var(--asphalt-700);border-radius:8px;
    width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;
  }
  .refresh-btn.spinning svg{animation:spin .7s linear;}
  @keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  .newshift-btn{
    margin:16px 18px;padding:16px;border-radius:14px;border:none;background:var(--asphalt-900);color:var(--text-light);
    font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
    background-image:repeating-linear-gradient(135deg, rgba(255,255,255,0.03) 0 8px, transparent 8px 16px);
    border-bottom:3px solid var(--safety-orange);
  }
  .list-title{padding:6px 18px;font-size:12.5px;font-weight:700;color:var(--stone-500);text-transform:uppercase;letter-spacing:.03em;}
  .shift-list{padding:0 18px 20px;display:flex;flex-direction:column;gap:10px;}
  .shift-card{
    background:#fff;border:1px solid var(--stone-300);border-radius:12px;padding:13px 14px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;
  }
  .shift-card .sc-main{min-width:0;}
  .shift-card .sc-date{font-weight:700;font-size:14.5px;}
  .shift-card .sc-op{font-size:12.5px;color:var(--stone-500);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sc-chevron{flex:none;color:var(--stone-500);}
  .empty-state{margin:10px 18px 20px;text-align:center;padding:30px 16px;border:1.5px dashed var(--stone-300);border-radius:14px;color:var(--stone-500);font-size:13.5px;}

  .summary-block{margin-bottom:16px;}
  .summary-block h3{
    font-size:13px;font-weight:700;color:var(--safety-orange-dark);margin:0 0 8px;
    display:flex;align-items:center;gap:6px;
  }
  .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .summary-item{background:var(--stone-100);border-radius:10px;padding:9px 11px;}
  .summary-item .si-label{font-size:11px;color:var(--stone-500);font-weight:600;}
  .summary-item .si-val{font-size:14.5px;font-weight:700;margin-top:2px;}
  .mini-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px;}
  .mini-table th{background:var(--stone-200);padding:6px 6px;font-weight:700;text-align:center;}
  .mini-table td{padding:6px 6px;text-align:center;border-bottom:1px solid var(--stone-200);}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--asphalt-900);color:var(--text-light);padding:12px 20px;border-radius:999px;
    font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;z-index:50;
    box-shadow:0 6px 20px rgba(0,0,0,.3);border:1.5px solid var(--safety-orange);
  }
  .confirm-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;
  }
  .confirm-box{background:#fff;border-radius:16px;padding:20px;max-width:340px;width:100%;text-align:center;}
  .confirm-box p{font-size:15px;font-weight:600;margin:0 0 16px;}
  .confirm-actions{display:flex;gap:10px;}

  @media (max-width:380px){
    .step-label{display:none;}
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

function computeProduction(startClock, endClock, startNA, endNA){
  if(startNA && endNA) return 'NA';
  const s = parseFloat(startClock), e = parseFloat(endClock);
  if(isNaN(s) || isNaN(e)) return null;
  const diff = e - s;
  if(diff < 0) return null;
  return Math.round(diff * 10) / 10;
}

function computeHoursFromTimes(startTime, endTime, startNA, endNA){
  if(startNA || endNA) return 'NA';
  if(!startTime || !endTime) return null;
  const sp = startTime.split(':').map(Number), ep = endTime.split(':').map(Number);
  if(sp.length<2 || ep.length<2 || sp.some(isNaN) || ep.some(isNaN)) return null;
  let startMin = sp[0]*60+sp[1], endMin = ep[0]*60+ep[1];
  let diff = endMin - startMin;
  if(diff <= 0) diff += 24*60;
  return Math.round((diff/60)*10)/10;
}

function durationMinutes(fromT, toT){
  if(!fromT || !toT) return 0;
  const fp = fromT.split(':').map(Number), tp = toT.split(':').map(Number);
  if(fp.length<2 || tp.length<2 || fp.some(isNaN) || tp.some(isNaN)) return 0;
  let startMin = fp[0]*60+fp[1], endMin = tp[0]*60+tp[1];
  let diff = endMin - startMin;
  if(diff <= 0) diff += 24*60;
  return diff;
}

function faultMinutesByUnit(faultRows, unit){
  return (faultRows||[]).filter(r=>r.faultUnit===unit).reduce((a,r)=>a+durationMinutes(r.fromHour,r.toHour),0);
}

function computeNetHours(grossHours, faultMinutes){
  if(grossHours === 'NA') return 'NA';
  if(grossHours === null || grossHours === undefined) return null;
  const net = grossHours - (faultMinutes/60);
  return Math.max(0, Math.round(net*10)/10);
}

function getProductionMonthKey(shift){
  const dateStr = shift.date;
  if(!dateStr) return null;
  const timeStr = shift.crusherStartTime || shift.secondaryStartTime || '06:00';
  const dt = new Date(dateStr + 'T' + timeStr + ':00');
  if(isNaN(dt.getTime())) return null;
  let y = dt.getFullYear(), m = dt.getMonth();
  if(dt.getDate()===1 && dt.getHours()<6){
    m -= 1;
    if(m<0){ m = 11; y -= 1; }
  }
  return y + '-' + String(m+1).padStart(2,'0');
}

function currentProductionMonthKey(){
  const now = new Date();
  let y = now.getFullYear(), m = now.getMonth();
  if(now.getDate()===1 && now.getHours()<6){
    m -= 1;
    if(m<0){ m = 11; y -= 1; }
  }
  return y + '-' + String(m+1).padStart(2,'0');
}

function shiftMonthKey(key, delta){
  const [y,m] = key.split('-').map(Number);
  let total = (y*12 + (m-1)) + delta;
  const ny = Math.floor(total/12), nm = total%12;
  return ny + '-' + String(nm+1).padStart(2,'0');
}

function computeMonthlyStats(key){
  const stats = {
    crusherTons:0, secondaryTons:0, crusherHours:0, secondaryHours:0,
    truckLoads:0, shovelLoads:0, faultMinutes:0, crusherFaultMinutes:0, secondaryFaultMinutes:0, shiftCount:0
  };
  state.shifts.forEach(s=>{
    if(getProductionMonthKey(s) !== key) return;
    stats.shiftCount++;
    const cT = computeProduction(s.crusherStartClock, s.crusherEndClock, s.crusherStartTimeNA, s.crusherEndTimeNA);
    const sT = computeProduction(s.secondaryStartClock, s.secondaryEndClock, s.secondaryStartTimeNA, s.secondaryEndTimeNA);
    if(typeof cT === 'number') stats.crusherTons += cT;
    if(typeof sT === 'number') stats.secondaryTons += sT;
    const cH = computeHoursFromTimes(s.crusherStartTime, s.crusherEndTime, s.crusherStartTimeNA, s.crusherEndTimeNA);
    const sH = computeHoursFromTimes(s.secondaryStartTime, s.secondaryEndTime, s.secondaryStartTimeNA, s.secondaryEndTimeNA);
    if(typeof cH === 'number') stats.crusherHours += cH;
    if(typeof sH === 'number') stats.secondaryHours += sH;
    (s.truckRows||[]).forEach(r=>{
      stats.truckLoads += Number(r.truckCount)||0;
      stats.shovelLoads += Number(r.shovelLoadsCount)||0;
    });
    (s.faultRows||[]).forEach(r=>{
      stats.faultMinutes += durationMinutes(r.fromHour, r.toHour);
    });
    stats.crusherFaultMinutes += faultMinutesByUnit(s.faultRows, 'crusher');
    stats.secondaryFaultMinutes += faultMinutesByUnit(s.faultRows, 'secondary');
  });
  stats.crusherTons = Math.round(stats.crusherTons*10)/10;
  stats.secondaryTons = Math.round(stats.secondaryTons*10)/10;
  stats.crusherHours = Math.round(stats.crusherHours*10)/10;
  stats.secondaryHours = Math.round(stats.secondaryHours*10)/10;
  stats.crusherNetHours = Math.max(0, Math.round((stats.crusherHours - stats.crusherFaultMinutes/60)*10)/10);
  stats.secondaryNetHours = Math.max(0, Math.round((stats.secondaryHours - stats.secondaryFaultMinutes/60)*10)/10);
  return stats;
}

function formatMinutes(mins){
  const h = Math.floor(mins/60), m = Math.round(mins%60);
  return h + ':' + String(m).padStart(2,'0');
}

function buildReportWorkbook(shiftsList){
  const T_ = t();
  const wb = XLSX.utils.book_new();

  const summaryRows = [[
    T_.date, T_.operatorName, T_.crusherProduction, T_.secondaryProduction,
    T_.crusherWorkedHours + ' (' + T_.grossHours + ')', T_.crusherWorkedHours + ' (' + T_.netHours + ')',
    T_.secondaryWorkedHours + ' (' + T_.grossHours + ')', T_.secondaryWorkedHours + ' (' + T_.netHours + ')',
    T_.shiftTruckLoads, T_.shiftShovelLoads, T_.shiftFaultTime + ' (min)'
  ]];
  const totals = {cTons:0,sTons:0,cHours:0,sHours:0,cNet:0,sNet:0,truck:0,shovel:0,faultMin:0};
  const sorted = [...shiftsList].sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  sorted.forEach(s=>{
    const cTons = computeProduction(s.crusherStartClock, s.crusherEndClock, s.crusherStartTimeNA, s.crusherEndTimeNA);
    const sTons = computeProduction(s.secondaryStartClock, s.secondaryEndClock, s.secondaryStartTimeNA, s.secondaryEndTimeNA);
    const cHours = computeHoursFromTimes(s.crusherStartTime, s.crusherEndTime, s.crusherStartTimeNA, s.crusherEndTimeNA);
    const sHours = computeHoursFromTimes(s.secondaryStartTime, s.secondaryEndTime, s.secondaryStartTimeNA, s.secondaryEndTimeNA);
    const cFaultMin = faultMinutesByUnit(s.faultRows, 'crusher');
    const sFaultMin = faultMinutesByUnit(s.faultRows, 'secondary');
    const cNet = computeNetHours(cHours, cFaultMin);
    const sNet = computeNetHours(sHours, sFaultMin);
    const truckSum = (s.truckRows||[]).reduce((a,r)=>a+(Number(r.truckCount)||0),0);
    const shovelSum = (s.truckRows||[]).reduce((a,r)=>a+(Number(r.shovelLoadsCount)||0),0);
    const faultMin = (s.faultRows||[]).reduce((a,r)=>a+durationMinutes(r.fromHour,r.toHour),0);
    const cTonsN = typeof cTons==='number' ? cTons : 0;
    const sTonsN = typeof sTons==='number' ? sTons : 0;
    const cHoursN = typeof cHours==='number' ? cHours : 0;
    const sHoursN = typeof sHours==='number' ? sHours : 0;
    const cNetN = typeof cNet==='number' ? cNet : 0;
    const sNetN = typeof sNet==='number' ? sNet : 0;
    summaryRows.push([fmtDate(s.date), s.operatorName||'', cTonsN, sTonsN, cHoursN, cNetN, sHoursN, sNetN, truckSum, shovelSum, faultMin]);
    totals.cTons+=cTonsN; totals.sTons+=sTonsN; totals.cHours+=cHoursN; totals.sHours+=sHoursN;
    totals.cNet+=cNetN; totals.sNet+=sNetN;
    totals.truck+=truckSum; totals.shovel+=shovelSum; totals.faultMin+=faultMin;
  });
  summaryRows.push([]);
  summaryRows.push([T_.totalProduction||'סה"כ','',
    Math.round(totals.cTons*10)/10, Math.round(totals.sTons*10)/10,
    Math.round(totals.cHours*10)/10, Math.round(totals.cNet*10)/10,
    Math.round(totals.sHours*10)/10, Math.round(totals.sNet*10)/10,
    totals.truck, totals.shovel, totals.faultMin]);
  const wsSummary = XLSX.utils.aoa_to_sheet(summaryRows);
  wsSummary['!cols'] = [{wch:12},{wch:16},{wch:14},{wch:16},{wch:14},{wch:14},{wch:16},{wch:16},{wch:14},{wch:14},{wch:16}];
  XLSX.utils.book_append_sheet(wb, wsSummary, T_.shiftTotals.slice(0,28) || 'Summary');

  const truckRows = [[T_.date, T_.operatorName, T_.fromHour, T_.toHour, T_.truckCount, T_.shovelLoadsCount]];
  sorted.forEach(s=>{
    (s.truckRows||[]).forEach(r=>{
      truckRows.push([fmtDate(s.date), s.operatorName||'', r.fromHour||'', r.toHour||'', Number(r.truckCount)||0, Number(r.shovelLoadsCount)||0]);
    });
  });
  const wsTrucks = XLSX.utils.aoa_to_sheet(truckRows);
  wsTrucks['!cols'] = [{wch:12},{wch:16},{wch:10},{wch:10},{wch:14},{wch:16}];
  XLSX.utils.book_append_sheet(wb, wsTrucks, T_.page2Title.slice(0,28));

  const faultRows = [[T_.date, T_.operatorName, T_.faultUnit, T_.fromHour, T_.toHour, T_.faultType, T_.faultDetail]];
  sorted.forEach(s=>{
    (s.faultRows||[]).forEach(r=>{
      const label = T_.faultTypes[r.faultType] || r.faultType || '';
      const unitLabel = T_.faultUnits[r.faultUnit] || '';
      const detail = r.faultDetailHe || r.faultDetailAr || '';
      faultRows.push([fmtDate(s.date), s.operatorName||'', unitLabel, r.fromHour||'', r.toHour||'', label, detail]);
    });
  });
  const wsFaults = XLSX.utils.aoa_to_sheet(faultRows);
  wsFaults['!cols'] = [{wch:12},{wch:16},{wch:14},{wch:10},{wch:10},{wch:14},{wch:30}];
  XLSX.utils.book_append_sheet(wb, wsFaults, T_.page3Title.slice(0,28));

  return wb;
}

function exportDailyReport(dateStr){

  const wb = buildReportWorkbook(list);
  XLSX.writeFile(wb, 'daily-report-' + dateStr + '.xlsx');
}

function exportMonthlyReportFile(monthKey){
  const list = state.shifts.filter(s=>getProductionMonthKey(s) === monthKey);
  if(list.length === 0){ showToast(t().noDataMonth); return; }
  const wb = buildReportWorkbook(list);
  XLSX.writeFile(wb, 'monthly-report-' + monthKey + '.xlsx');
}

const translateCache = {};
async function translateText(text, fromLang){
  const trimmed = (text||'').trim();
  if(!trimmed) return '';
  const toLang = fromLang === 'he' ? 'ar' : 'he';
  const cacheKey = fromLang + '::' + trimmed;
  if(translateCache[cacheKey]) return translateCache[cacheKey];
  try{
    const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=' + fromLang + '&tl=' + toLang + '&dt=t&q=' + encodeURIComponent(trimmed);
    const response = await fetch(url);
    const data = await response.json();
    const textOut = (data && data[0]) ? data[0].map(seg=>seg[0]).join('').trim() : '';
    if(textOut){ translateCache[cacheKey] = textOut; }
    return textOut;
  }catch(e){
    return '';
  }
}

async function loadShifts(){
  try{
    const res = await fetch(SHEETS_API_URL, { method:'GET' });
    const data = await res.json();
    state.shifts = data.shifts || [];
    state.remoteDraft = data.draft || null;
  }catch(e){
    // keep whatever was already loaded if the sheet is unreachable
  }
}

let draftSaveTimer = null;
function scheduleDraftSave(){
  if(state.screen !== 'form') return;
  clearTimeout(draftSaveTimer);
  draftSaveTimer = setTimeout(()=>{
    saveDraftRemote({ form: state.form, step: state.step, editingId: state.editingId });
  }, 900);
}

function flushDraftSave(){
  if(state.screen !== 'form') return;
  clearTimeout(draftSaveTimer);
  const payload = JSON.stringify({ action:'saveDraft', draft: { form: state.form, step: state.step, editingId: state.editingId } });
  try{
    if(navigator.sendBeacon){
      const blob = new Blob([payload], { type: 'text/plain;charset=UTF-8' });
      navigator.sendBeacon(SHEETS_API_URL, blob);
    } else {
      fetch(SHEETS_API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: payload, keepalive:true });
    }
  }catch(e){}
}

async function saveDraftRemote(draft){
  try{
    await fetch(SHEETS_API_URL, {
      method:'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'saveDraft', draft })
    });
  }catch(e){}
}

async function clearDraftRemote(){
  try{
    await fetch(SHEETS_API_URL, {
      method:'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'clearDraft' })
    });
  }catch(e){}
}

function draftHasContent(draft){
  if(!draft || !draft.form) return false;
  const f = draft.form;
  if(draft.step && draft.step > 1) return true;
  if(f.date || f.operatorName || f.crusherStartClock || f.secondaryStartClock) return true;
  if((f.truckRows||[]).length > 0) return true;
  if((f.faultRows||[]).length > 0) return true;
  return false;
}

async function saveShiftRemote(shift){
  try{
    await fetch(SHEETS_API_URL, {
      method:'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'save', shift })
    });
    return true;
  }catch(e){ return false; }
}

async function deleteShiftRemote(id){
  try{
    await fetch(SHEETS_API_URL, {
      method:'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'delete', id })
    });
    return true;
  }catch(e){ return false; }
}

function showToast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 2200);
}

function fmtDate(d){
  if(!d) return '—';
  const parts = d.split('-');
  if(parts.length===3) return parts[2]+'.'+parts[1]+'.'+parts[0];
  return d;
}

function el(tag, attrs, ...children){
  const e = document.createElement(tag);
  for(const k in (attrs||{})){
    const v = attrs[k];
    if(k==='class') e.className = v;
    else if(k==='html') e.innerHTML = v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if(v === null || v === undefined || v === false){ /* skip: no attribute */ }
    else if(v === true) e.setAttribute(k, '');
    else e.setAttribute(k, v);
  }
  children.flat().forEach(c=>{
    if(c===null||c===undefined) return;
    if(typeof c === 'string' || typeof c === 'number' || typeof c === 'boolean') e.appendChild(document.createTextNode(String(c)));
    else e.appendChild(c);
  });
  return e;
}

async function triggerFaultTranslation(row, sourceLang, currentKey, otherKey){
  const text = (row[currentKey]||'').trim();
  if(!text){ row[otherKey] = ''; row.translateFailed = false; renderInline(); return; }
  if(row.lastTranslatedSource === text && row[otherKey]) return;
  row.translating = true;
  row.translateFailed = false;
  renderInline();
  const result = await translateText(text, sourceLang);
  row.translating = false;
  if(result){
    row[otherKey] = result;
    row.lastTranslatedSource = text;
  } else {
    row.translateFailed = true;
  }
  renderInline();
}

async function translateAllPendingFaults(){
  const rows = state.form.faultRows || [];
  for(const row of rows){
    if(row.faultDetailHe && !row.faultDetailAr){
      row.translating = true;
      const res = await translateText(row.faultDetailHe, 'he');
      row.translating = false;
      if(res){ row.faultDetailAr = res; row.lastTranslatedSource = row.faultDetailHe; }
      else { row.translateFailed = true; }
    } else if(row.faultDetailAr && !row.faultDetailHe){
      row.translating = true;
      const res = await translateText(row.faultDetailAr, 'ar');
      row.translating = false;
      if(res){ row.faultDetailHe = res; row.lastTranslatedSource = row.faultDetailAr; }
      else { row.translateFailed = true; }
    }
  }
}

function roundHourField(label, val, onSet){
  const f = el('div', {class:'mini-field'});
  f.appendChild(el('label', {}, label));
  const sel = el('select', {onchange:(e)=>{ onSet(e.target.value); scheduleDraftSave(); }});
  sel.appendChild(el('option', {value:''}, '—'));
  for(let h=0; h<24; h++){
    const hh = String(h).padStart(2,'0') + ':00';
    sel.appendChild(el('option', {value:hh, selected: val===hh ? 'selected' : null}, hh));
  }
  sel.value = val || '';
  f.appendChild(sel);
  return f;
}

function miniField(label, type, val, onSet, extra){
  const f = el('div', {class:'mini-field'});
  f.appendChild(el('label', {}, label));
  f.appendChild(el('input', Object.assign({type:type, value: val||''}, extra||{}, {
    oninput:(e)=>{ onSet(e.target.value); scheduleDraftSave(); }
  })));
  return f;
}

function validateStep1(){
  state.errors = {};
  if(!state.form.date) state.errors.date = true;
  if(!state.form.operatorName) state.errors.operatorName = true;
  return Object.keys(state.errors).length === 0;
}

function renderBottombar(){
  const T_ = t();
  const bar = el('nav', {class:'bottombar'});
  if(state.step > 1){
    bar.appendChild(el('button', {class:'btn btn-ghost', onclick:()=>{ state.step--; state.errors={}; render(); scheduleDraftSave(); }}, T_.back));
  }
  if(state.step < 4){
    bar.appendChild(el('button', {class:'btn btn-primary', onclick:()=>{
      if(state.step===1 && !validateStep1()){ render(); return; }
      const leavingFaultsStep = state.step===3;
      state.step++; render();
      scheduleDraftSave();
      if(leavingFaultsStep){ translateAllPendingFaults().then(()=>{ if(state.screen==='form') render(); }); }
    }}, T_.next));
  } else {
    bar.appendChild(el('button', {class:'btn btn-success', onclick: submitShift},
      el('span',{html:ICONS.check}), T_.submit));
  }
  return bar;
}

async function submitShift(){
  await translateAllPendingFaults();
  clearTimeout(draftSaveTimer);
  const createdAt = state.editingId ? ((state.shifts.find(s=>s.id===state.editingId)||{}).createdAt || Date.now()) : Date.now();
  const id = state.editingId || uid();
  const record = Object.assign({}, state.form, {id, createdAt});
  const idx = state.shifts.findIndex(s=>s.id===id);
  if(idx>=0) state.shifts[idx] = record; else state.shifts.push(record);
  const ok = await saveShiftRemote(record);
  await clearDraftRemote();
  await loadShifts();
  state.screen = 'home';
  state.editingId = null;
  render();
  showToast(ok ? t().savedToast : t().saveFailed);
}

async function confirmDelete(){

  state.shifts = state.shifts.filter(s=>s.id!==id);
  await deleteShiftRemote(id);
  await loadShifts();
  state.confirmDeleteId = null;
  state.screen = 'home';
  state.editingId = null;
  render();
  showToast(t().deletedToast);
}

function requestEditShift(id){
  if(state.adminUnlocked){
    openShiftForEdit(id);
  } else {
    state.adminPromptFor = id;
    state.adminPromptAction = 'edit';
    state.adminError = false;
    render();
  }
}

function requestDeleteShift(id){
  if(state.adminUnlocked){
    state.confirmDeleteId = id;
    render();
  } else {
    state.adminPromptFor = id;
    state.adminPromptAction = 'delete';
    state.adminError = false;
    render();
  }
}

function openShiftForEdit(id){
  const s = state.shifts.find(x=>x.id===id);
  if(!s) return;
  state.form = Object.assign(emptyForm(), JSON.parse(JSON.stringify(s)));
  state.editingId = id;
  state.step = 1;
  state.errors = {};
  state.screen = 'form';
  render();
  scheduleDraftSave();
}

setupPWA();

(async function init(){
  await loadShifts();
  if(draftHasContent(state.remoteDraft)){
    state.form = Object.assign(emptyForm(), state.remoteDraft.form || {});
    state.step = state.remoteDraft.step || 1;
    state.editingId = state.remoteDraft.editingId || null;
    state.screen = 'form';
    showToast(t().resumedDraftToast);
  }
  render();
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'hidden'){ flushDraftSave(); }
  });
  window.addEventListener('pagehide', flushDraftSave);
})();

setInterval(async ()=>{
  if(state.screen === 'home'){
    const before = JSON.stringify(state.shifts);
    await loadShifts();
    if(JSON.stringify(state.shifts) !== before){ render(); }
  }
}, 15000);
</script>
